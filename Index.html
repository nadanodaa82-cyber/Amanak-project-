<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة أمانك | Amank</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; padding: 0; background: #f8f5fb; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: 'Cairo', sans-serif; overflow: hidden; }
        
        /* تصميم شعار احترافي بالكود بدل الصورة */
        .logo-circle {
            width: 150px; height: 150px;
            background: #6a1b9a;
            border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            color: white; font-size: 40px; font-weight: bold;
            box-shadow: 0 10px 20px rgba(106, 27, 154, 0.3);
            animation: pulse 2s infinite;
        }

        .text-container { text-align: center; margin-top: 20px; }
        h1 { color: #6a1b9a; font-size: 28px; }
        p { color: #888; }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>
    <div class="text-container">
        <div class="logo-circle" style="margin: auto;">A</div>
        <h1>AMANK | أمانك</h1>
        <p>جاري فتح المنصة...</p>
    </div>

    <script>
        // لو حابة الصورة تشتغل إجباري، جربي ترفعي صورة جديدة باسم logo.jpg 
        // واستبدلي الدائرة (div) بـ <img src="logo.jpg">
        setTimeout(() => {
            alert("أهلاً بكِ في عرض مشروع التخرج");
        }, 2000);
    </script>
</body>
</html>
