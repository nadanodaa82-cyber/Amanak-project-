<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة أمانك | AMANK</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* التنسيق العام */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; }
        body { background-color: #f8f5fb; color: #333; overflow-x: hidden; }

        /* تصميم الشعار الرقمي (بديل الصورة لضمان الظهور) */
        .digital-logo {
            width: 120px; height: 120px;
            background: linear-gradient(135deg, #6a1b9a, #9c27b0);
            color: white; border-radius: 30px;
            display: flex; justify-content: center; align-items: center;
            font-size: 50px; font-weight: bold; margin: 0 auto 20px;
            box-shadow: 0 10px 20px rgba(106, 27, 154, 0.2);
            animation: zoomIn 1s ease;
        }

        /* شريط التنقل */
        header { background: #fff; padding: 15px 5%; box-shadow: 0 2px 10px rgba(106, 27, 154, 0.1); position: sticky; top: 0; z-index: 100; display: none; }
        nav { display: flex; justify-content: space-between; align-items: center; }
        .nav-links { display: flex; list-style: none; }
        .nav-links li { margin-right: 20px; cursor: pointer; font-weight: bold; color: #6a1b9a; }
        .btn-login { background: #6a1b9a; color: #fff; padding: 8px 20px; border-radius: 20px; font-size: 14px; }

        /* الصفحات */
        .hero { padding: 80px 5%; text-align: center; background: linear-gradient(180deg, #fff 0%, #f3e5f5 100%); min-height: 80vh; }
        .page-container { padding: 60px 5%; text-align: center; min-height: 70vh; }
        
        /* الأزرار */
        .btn-primary { background: #6a1b9a; color: #fff; border: none; padding: 12px 35px; border-radius: 30px; cursor: pointer; font-size: 16px; margin: 10px; transition: 0.3s; }
        .btn-primary:hover { transform: scale(1.05); background: #4a148c; }

        /* الكروت */
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-top: 30px; }
        .card { background: #fff; padding: 30px; border-radius: 20px; border-bottom: 4px solid #6a1b9a; box-shadow: 0 5px 15px rgba(0,0,0,0.05); }

        /* النوافذ */
        .modal { display: none; position: fixed; z-index: 200; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); }
        .modal-content { background: #fff; margin: 15% auto; padding: 30px; width: 90%; max-width: 400px; border-radius: 20px; text-align: center; position: relative; }
        
        footer { background: #4a148c; color: #fff; text-align: center; padding: 20px; display: none; }

        @keyframes zoomIn { from { opacity: 0; transform: scale(0.5); } to { opacity: 1; transform: scale(1); } }
    </style>
</head>
<body>

    <header id="main-header">
        <nav>
            <div style="font-weight: bold; color: #6a1b9a; font-size: 20px;">AMANAK</div>
            <ul class="nav-links">
                <li onclick="showPage('home')">الرئيسية</li>
                <li onclick="showPage('dashboard')">التحكم</li>
                <li class="btn-login" onclick="alert('قريباً...')">دخول</li>
            </ul>
        </nav>
    </header>

    <main id="main-content">
        </main>

    <template id="page-splash">
        <div style="height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; background: #fff;">
            <div class="digital-logo">A</div>
            <h1 style="color: #6a1b9a;">أمانك | AMANK</h1>
            <p style="color: #888;">جامعة طيبة - مشروع تخرج 2026</p>
        </div>
    </template>

    <template id="page-home">
        <section class="hero">
            <div class="digital-logo">A</div>
            <h1>مرحباً بك في منصة أمانك</h1>
            <p style="margin: 20px 0; font-size: 18px; color: #666;">بيئة آمنة للاستشارات النفسية والتربوية للطلاب.</p>
            <button class="btn-primary" onclick="showPage('dashboard')">ابدأ استكشاف المنصة</button>
        </section>
    </template>

    <template id="page-dashboard">
        <section class="page-container">
            <h2 style="color: #6a1b9a;">لوحة تحكم الطالب</h2>
            <div class="grid">
                <div class="card">
                    <h3>حجز موعد</h3>
                    <p>احجز جلستك القادمة مع المستشار.</p>
                    <button class="btn-primary" style="padding: 8px 20px; font-size: 14px;">حجز</button>
                </div>
                <div class="card" onclick="openModal('reportModal')" style="cursor:pointer;">
                    <h3>التقرير النفسي</h3>
                    <p>عرض وتحميل تقرير الحالة.</p>
                    <button class="btn-primary" style="padding: 8px 20px; font-size: 14px;">فتح</button>
                </div>
            </div>
        </section>
    </template>

    <div id="reportModal" class="modal">
        <div class="modal-content">
            <h2 style="color: #6a1b9a;">التقرير النهائي</h2>
            <p style="margin: 20px 0;">الحالة: مستقرة.<br>التوصية: استمرار التفاعل الإيجابي.</p>
            <button class="btn-primary" onclick="window.print()">طباعة PDF</button>
            <p onclick="closeModal()" style="cursor:pointer; color: #888; margin-top: 10px;">إغلاق</p>
        </div>
    </div>

    <footer id="main-footer">
        <p>مشروع تخرج - منصة أمانك &copy; 2026</p>
    </footer>

    <script>
        function showPage(pageId) {
            const mainContent = document.getElementById('main-content');
            const template = document.getElementById('page-' + pageId);
            const header = document.getElementById('main-header');
            const footer = document.getElementById('main-footer');

            if (pageId === 'splash') {
                header.style.display = 'none';
                footer.style.display = 'none';
            } else {
                header.style.display = 'block';
                footer.style.display = 'block';
            }

            mainContent.innerHTML = '';
            mainContent.appendChild(template.content.cloneNode(true));
        }

        function openModal() { document.getElementById('reportModal').style.display = "block"; }
        function closeModal() { document.getElementById('reportModal').style.display = "none"; }

        window.onload = () => {
            showPage('splash');
            setTimeout(() => {
                showPage('home');
            }, 3000); // 3 ثوانٍ لشاشة البداية
        };
    </script>
</body>
</html>
